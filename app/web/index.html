<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="المساعد الشخصي — الطلبات والمهام والاجتماعات والعملاء في مكان واحد.">
  <meta name="theme-color" content="#FFFFFF">

  <!-- iPhone: التشغيل كتطبيق بعد «إضافة إلى الشاشة الرئيسية» -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Zypro">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png">

  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <title>Zypro</title>

  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: -apple-system, system-ui, sans-serif; color: #5B5E6B;
    }
    #splash img { width: 160px; height: auto; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/zypro_wordmark.png" alt="Zypro">
    <span>جارٍ التحميل…</span>
  </div>
  <script>
    // ---- الإشعارات (Web Push) ----
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('push-sw.js').catch(function () {});
    }
    function zyproB64ToBytes(s) {
      var pad = '='.repeat((4 - (s.length % 4)) % 4);
      var b = atob((s + pad).replace(/-/g, '+').replace(/_/g, '/'));
      var out = new Uint8Array(b.length);
      for (var i = 0; i < b.length; i++) out[i] = b.charCodeAt(i);
      return out;
    }
    window.zyproPushSupported = function () {
      return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
    };
    window.zyproPushPermission = function () {
      return ('Notification' in window) ? Notification.permission : 'unsupported';
    };
    window.zyproPushStandalone = function () {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    };
    // تُستدعى مباشرة من ضغطة زر (شرط آبل لطلب الإذن)
    window.zyproPushSubscribe = async function (key) {
      var perm = await Notification.requestPermission();
      if (perm !== 'granted') return '';
      var reg = await navigator.serviceWorker.ready;
      var sub = await reg.pushManager.getSubscription();
      if (!sub) {
        sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: zyproB64ToBytes(key) });
      }
      return JSON.stringify(sub.toJSON());
    };
    window.zyproPushUnsubscribe = async function () {
      var reg = await navigator.serviceWorker.ready;
      var sub = await reg.pushManager.getSubscription();
      if (!sub) return '';
      var endpoint = sub.endpoint;
      await sub.unsubscribe();
      return endpoint;
    };


    // التعرّف على الكلام من المتصفح (مجاني، يعمل على Safari وChrome)
    var zyproRec = null;
    window.zyproSpeechSupported = function () {
      return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
    };
    window.zyproSpeechStart = function (lang, continuous, onPartial, onDone, onError) {
      var R = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!R) { onError('unsupported'); onDone(''); return; }
      try { if (zyproRec) zyproRec.abort(); } catch (e) {}
      var rec = new R();
      zyproRec = rec;
      rec.lang = lang;
      rec.interimResults = true;
      rec.continuous = !!continuous;
      rec.maxAlternatives = 1;
      var finalText = '';
      var ended = false;
      rec.onresult = function (e) {
        var interim = '';
        for (var i = e.resultIndex; i < e.results.length; i++) {
          var t = e.results[i][0].transcript;
          if (e.results[i].isFinal) finalText += (finalText ? ' ' : '') + t.trim();
          else interim += t;
        }
        onPartial((finalText + ' ' + interim).trim());
      };
      rec.onerror = function (e) { onError((e && e.error) || 'error'); };
      rec.onend = function () {
        if (ended) return;
        ended = true;
        zyproRec = null;
        onDone(finalText);
      };
      try { rec.start(); } catch (e) { onError('start-failed'); ended = true; onDone(''); }
    };
    window.zyproSpeechStop = function () {
      try { if (zyproRec) zyproRec.stop(); } catch (e) {}
    };

    // ---- التصدير والمشاركة والطباعة (التقارير) ----
    window.zyproDownload = function (name, text, mime) {
      var parts = mime.indexOf('csv') >= 0 ? ['﻿', text] : [text];
      var blob = new Blob(parts, { type: mime });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    };
    window.zyproShare = async function (title, text) {
      try {
        if (navigator.share) { await navigator.share({ title: title, text: text }); return 'shared'; }
      } catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
      try { await navigator.clipboard.writeText(text); return 'copied'; } catch (e) { return 'failed'; }
    };
    window.zyproPrintHtml = function (html) {
      var f = document.createElement('iframe');
      f.setAttribute('aria-hidden', 'true');
      f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
      document.body.appendChild(f);
      var d = f.contentWindow.document;
      d.open(); d.write(html); d.close();
      setTimeout(function () {
        try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) {}
        setTimeout(function () { f.remove(); }, 60000);
      }, 500);
    };
    window.zyproFullscreen = function (on) {
      try {
        if (on && !document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
        if (!on && document.fullscreenElement) document.exitFullscreen();
      } catch (e) {}
    };

    // ---- «تذكرني» وقفل التطبيق ببصمة الوجه/الإصبع (WebAuthn على الجهاز) ----
    window.zyproSessionFlag = function (set) {
      try {
        if (set) sessionStorage.setItem('zypro_active', '1');
        return sessionStorage.getItem('zypro_active') === '1';
      } catch (e) { return true; }
    };
    function zyproB64(buf) {
      var b = new Uint8Array(buf), s = '';
      for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
      return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function zyproFromB64(str) {
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      var s = atob(str), b = new Uint8Array(s.length);
      for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
      return b;
    }
    window.zyproBioAvailable = async function () {
      // نكتفي بوجود WebAuthn: بعض إصدارات iOS (خاصة التطبيق المضاف للشاشة الرئيسية)
      // تُرجع false لفحص المصادقة المدمجة رغم أن Face ID يعمل فعليًا؛ المحاولة نفسها هي الحكم.
      try {
        return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create && window.isSecureContext);
      } catch (e) { return false; }
    };
    window.zyproBioRegister = async function (userId, name) {
      try {
        var cred = await navigator.credentials.create({ publicKey: {
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          rp: { name: 'Zypro' },
          user: { id: new TextEncoder().encode(userId).slice(0, 64), name: name, displayName: name },
          pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
          authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
          timeout: 60000, attestation: 'none',
          extensions: { prf: {} }
        } });
        return cred ? zyproB64(cred.rawId) : 'error:none';
      } catch (e) { return 'error:' + ((e && e.name) || 'unknown'); }
    };
    window.zyproBioVerify = async function (id) {
      try {
        var res = await navigator.credentials.get({ publicKey: {
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          allowCredentials: [{ type: 'public-key', id: zyproFromB64(id), transports: ['internal', 'hybrid'] }],
          userVerification: 'required', timeout: 60000
        } });
        return res ? 'ok' : 'error:none';
      } catch (e) { return 'error:' + ((e && e.name) || 'unknown'); }
    };

    // حفظ كلمة المرور مشفّرة بمفتاح لا يُستخرج إلا بعد Face ID (امتداد PRF)
    async function zyproPrfKey(id) {
      var res = await navigator.credentials.get({ publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        allowCredentials: [{ type: 'public-key', id: zyproFromB64(id), transports: ['internal', 'hybrid'] }],
        userVerification: 'required', timeout: 60000,
        extensions: { prf: { eval: { first: new TextEncoder().encode('zypro-login-key-v1') } } }
      } });
      var ext = res && res.getClientExtensionResults ? res.getClientExtensionResults() : {};
      var out = ext && ext.prf && ext.prf.results && ext.prf.results.first;
      if (!out) { var err = new Error('no prf'); err.name = 'NoPrf'; throw err; }
      return crypto.subtle.importKey('raw', out, 'AES-GCM', false, ['encrypt', 'decrypt']);
    }
    window.zyproBioSeal = async function (id, text) {
      try {
        var key = await zyproPrfKey(id);
        var iv = crypto.getRandomValues(new Uint8Array(12));
        var ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(text));
        var all = new Uint8Array(12 + ct.byteLength);
        all.set(iv); all.set(new Uint8Array(ct), 12);
        return zyproB64(all.buffer);
      } catch (e) { return 'error:' + ((e && e.name) || 'unknown'); }
    };
    window.zyproBioOpen = async function (id, sealed) {
      try {
        var key = await zyproPrfKey(id);
        var all = zyproFromB64(sealed);
        var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: all.slice(0, 12) }, key, all.slice(12));
        return 'ok:' + new TextDecoder().decode(pt);
      } catch (e) { return 'error:' + ((e && e.name) || 'unknown'); }
    };

    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

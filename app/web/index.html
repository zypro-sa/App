<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="المساعد الشخصي — الطلبات والمهام والاجتماعات والعملاء في مكان واحد.">
  <meta name="theme-color" content="#FFFFFF">

  <!-- iPhone: التشغيل كتطبيق بعد «إضافة إلى الشاشة الرئيسية» -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Zypro">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Zypro</title>

  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: -apple-system, system-ui, sans-serif; color: #5B5E6B;
    }
    #splash img { width: 160px; height: auto; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/zypro_wordmark.png" alt="Zypro">
    <span>جارٍ التحميل…</span>
  </div>
  <script>
    // ---- الإشعارات (Web Push) ----
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('push-sw.js').catch(function () {});
    }
    function zyproB64ToBytes(s) {
      var pad = '='.repeat((4 - (s.length % 4)) % 4);
      var b = atob((s + pad).replace(/-/g, '+').replace(/_/g, '/'));
      var out = new Uint8Array(b.length);
      for (var i = 0; i < b.length; i++) out[i] = b.charCodeAt(i);
      return out;
    }
    window.zyproPushSupported = function () {
      return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
    };
    window.zyproPushPermission = function () {
      return ('Notification' in window) ? Notification.permission : 'unsupported';
    };
    window.zyproPushStandalone = function () {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    };
    // تُستدعى مباشرة من ضغطة زر (شرط آبل لطلب الإذن)
    window.zyproPushSubscribe = async function (key) {
      var perm = await Notification.requestPermission();
      if (perm !== 'granted') return '';
      var reg = await navigator.serviceWorker.ready;
      var sub = await reg.pushManager.getSubscription();
      if (!sub) {
        sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: zyproB64ToBytes(key) });
      }
      return JSON.stringify(sub.toJSON());
    };
    window.zyproPushUnsubscribe = async function () {
      var reg = await navigator.serviceWorker.ready;
      var sub = await reg.pushManager.getSubscription();
      if (!sub) return '';
      var endpoint = sub.endpoint;
      await sub.unsubscribe();
      return endpoint;
    };

    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
